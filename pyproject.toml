[project]
name = "scada-bridge-mcp"
version = "0.1.0"
description = "Bridge industrial SCADA / Modbus / OPC-UA (OT) to ONE OS — parse, map, govern (IEC 62443 / NIS2). CSOAI Layer-0 legacy-bridge family."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CSOAI-ORG"}]
dependencies = ["mcp>=2.0.0", "pydantic>=2.0.0"]

[project.scripts]
scada-bridge-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "mcp2026_shim.py"]
